services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password

    volumes:
      - db-data:/var/lib/postgresql/data

    networks:
      - aponti-overlay
    
    secrets: 
      - db_password
    
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      
      resources:
        limits: {
          cpus: "0.50",
          memory: 512M
        }

  product-service:
    image: aponti/product-service:1.0
    environment:
      PORT: "3001"
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: ${POSTGRES_DB}
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD_FILE: /run/secrets/db_password
    
    networks:
      - aponti-overlay

    secrets:
      - db_password

    deploy:
      replicas: 3

      restart_policy: {
        condition: on-failure
      }

      update_config:
        order: start-first
        parallelism: 1
        delay: 10s

      resources:
        limits: {
          cpus: "0.25",
          memory: 128M
        }

  inventory-service:
    image: aponti/inventory-service:1.0
    environment:
      PORT: "3002"
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: ${POSTGRES_DB}
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD_FILE: /run/secrets/db_password
    
    networks:
      - aponti-overlay

    secrets:
      - db_password

    deploy:
      replicas: 3

      restart_policy: {
        condition: on-failure
      }

      update_config:
        order: start-first
        parallelism: 1
        delay: 10s

      resources: 
        limits: {
          cpus: "0.25",
          memory: 128M
        }

  order-service:
    image: aponti/order-service:1.0
    environment:
      PORT: "3003"
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: ${POSTGRES_DB}
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD_FILE: /run/secrets/db_password

    networks:
      - aponti-overlay

    secrets:
      - db_password

    deploy:
      replicas: 3

      restart_policy: {
        condition: on-failure
      }

      update_config:
        order: start-first
        parallelism: 1
        delay: 10s

      resources: 
        limits: {
          cpus: "0.25",
          memory: 128M
        }

  api-gateway:
    image: aponti/api-gateway:1.0
    environment:
      PORT: "3000"
      PRODUCT_SERVICE_URL: http://product-service:3001
      INVENTORY_SERVICE_URL: http://inventory-service:3002
      ORDER_SERVICE_URL: http://order-service:3003

    ports:
      - target: 3000
        published: 8080
        protocol: tcp
        mode: ingress

    networks:
      - aponti-overlay
    
    deploy:
      replicas: 2

      restart_policy: {
        condition: on-failure
      }

      update_config:
        order: start-first
        parallelism: 1 
        delay: 10s

      resources: 
        limits: {
          cpus: "0.50",
          memory: 256M
        }

networks:
  aponti-overlay:
    driver: overlay
    attachable: true

volumes:
  db-data:

secrets:
  db_password:
    external: true